<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Day W - WNBA Lookup</title>
  <meta name="description" content="Game Day W — sleek WNBA lookup hub with rosters, schedule, stats, and more." />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph / Twitter — shared deep links (a player, tonight's matchup) get a proper card. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Game Day W" />
  <meta property="og:title" content="Game Day W — WNBA Lookup Hub" />
  <meta property="og:description" content="Rosters, schedule, live scores, stats, injuries, and trades — faster than the big apps." />
  <meta property="og:image" content="/icon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Game Day W — WNBA Lookup Hub" />
  <meta name="twitter:description" content="Rosters, schedule, live scores, stats, injuries, and trades — faster than the big apps." />
  <meta name="twitter:image" content="/icon.png" />

  <link rel="icon" type="image/svg+xml" href="/light.svg" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Game Day W" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="court-lines" aria-hidden="true"></div>

      <div class="topbar">
        <a class="brand-lockup" href="#" aria-label="Game Day W home">
          <span class="brand-mark"><img src="/light.svg" alt="Game Day W logo" /></span>
          <span>
            <strong>Game Day W</strong>
            <em>WNBA lookup hub</em>
          </span>
        </a>

        <div class="global-search" id="globalSearch">
          <span class="global-search-icon" aria-hidden="true">🔍</span>
          <input
            type="search"
            id="globalSearchInput"
            class="global-search-input"
            placeholder="Search players, teams, coaches…"
            autocomplete="off"
            aria-label="Search players, teams, and coaches"
            aria-controls="globalSearchResults"
            aria-expanded="false"
          />
          <div id="globalSearchResults" class="global-search-results hidden" role="listbox"></div>
        </div>

        <div class="theme-picker">
          <label for="themeSelect">Team skin</label>
          <select id="themeSelect"></select>
        </div>
      </div>

    </header>

    <div class="live-now-bar">
      <button id="todayStrip" class="today-strip" aria-label="See today's games">
        <span class="today-strip-loading">Checking tonight's slate…</span>
      </button>
    </div>

    <nav class="tabs" aria-label="Primary sections" role="tablist">
      <button class="tab-btn active" data-tab="rosters" id="tab-rosters" role="tab" aria-selected="true" aria-controls="rosters" tabindex="0">
        <span class="tab-icon">🏀</span>
        Teams
      </button>
      <button class="tab-btn" data-tab="schedule" id="tab-schedule" role="tab" aria-selected="false" aria-controls="schedule" tabindex="-1">
        <span class="tab-icon">📅</span>
        Schedule
      </button>
      <button class="tab-btn" data-tab="stats" id="tab-stats" role="tab" aria-selected="false" aria-controls="stats" tabindex="-1">
        <span class="tab-icon">📊</span>
        Stats
      </button>
      <button class="tab-btn" data-tab="injuries" id="tab-injuries" role="tab" aria-selected="false" aria-controls="injuries" tabindex="-1">
        <span class="tab-icon">⛑</span>
        Injuries
      </button>
      <button class="tab-btn" data-tab="trades" id="tab-trades" role="tab" aria-selected="false" aria-controls="trades" tabindex="-1">
        <span class="tab-icon">🔄</span>
        Trades
      </button>
      <button class="tab-btn" data-tab="challenge" id="tab-challenge" role="tab" aria-selected="false" aria-controls="challenge" tabindex="-1">
        <span class="tab-icon">🎯</span>
        Challenge
      </button>
    </nav>

    <main>
      <div id="banner" class="banner hidden">
        <span id="bannerText"></span>
        <button class="close-btn" onclick="closeBanner()" aria-label="Close banner">×</button>
      </div>

      <section id="rosters" class="tab-content active" role="tabpanel" aria-labelledby="tab-rosters">
        <div class="section-head">
          <h2>Teams</h2>
          <div class="filters">
            <select id="teamFilter">
              <option value="">Select Team...</option>
            </select>
          </div>
        </div>

        <div id="rostersGrid" class="grid">
          <p>Loading rosters...</p>
        </div>
      </section>

      <section id="schedule" class="tab-content" role="tabpanel" aria-labelledby="tab-schedule">
        <div class="section-head">
          <h2>Schedule</h2>
          <div class="filters">
            <select id="scheduleTeamFilter" aria-label="Filter schedule by team">
              <option value="">All Teams</option>
            </select>
          </div>
        </div>

        <div id="scheduleGrid" class="grid">
          <p>Loading schedule...</p>
        </div>
      </section>

      <section id="stats" class="tab-content" role="tabpanel" aria-labelledby="tab-stats">
        <div class="section-head">
          <h2>Stats</h2>
        </div>

        <div id="statsGrid" class="grid">
          <p>Loading league leaders…</p>
        </div>
      </section>

      <section id="injuries" class="tab-content" role="tabpanel" aria-labelledby="tab-injuries">
        <div class="section-head">
          <h2>Injuries</h2>
          <div class="filters">
            <select id="injuriesTeamFilter" aria-label="Filter injuries by team">
              <option value="">All Teams</option>
            </select>
          </div>
        </div>

        <div id="injuriesGrid" class="grid">
          <p>Loading injury report...</p>
        </div>
      </section>

      <section id="trades" class="tab-content" role="tabpanel" aria-labelledby="tab-trades">
        <div class="section-head">
          <h2>Trades</h2>
        </div>

        <div id="tradesGrid" class="grid">
          <p>Loading recent trades…</p>
        </div>
      </section>

      <section id="challenge" class="tab-content" role="tabpanel" aria-labelledby="tab-challenge">
        <div class="section-head">
          <h2>WNBA Challenge</h2>
        </div>

        <div id="challengeGrid">
          <p>Loading challenge…</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Game Day W | Data powered by ESPN</p>
    </footer>
  </div>

  <div id="liveModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="liveModalTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h2 id="liveModalTitle">Live Now</h2>
        <button class="modal-close" id="liveModalClose" aria-label="Close">×</button>
      </div>
      <div id="liveModalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
